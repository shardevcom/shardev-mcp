name: laravel
scope: project
order: 10
requires: [project.name, project.primary_app, project.primary_provider, project.primary_session_guard]
files:
  - { tree: files, dest: ., render: [composer.json, config/auth.php, config/authentications.php, config/passport.php, routes/web.php] }
  - { src: bin/artisan, dest: artisan, raw: true, mode: "0755" }
  # npm omite este .gitignore del tarball: se guarda con otro nombre y se restaura al generar.
  - { src: dotfiles/storage-framework.gitignore, dest: storage/framework/.gitignore, raw: true }
