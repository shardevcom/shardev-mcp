# Entorno de desarrollo/CI. Ningún valor sensible va aquí: se leen de .env con ${VAR}.
# Las variables obligatorias hacen fallar `docker compose config` si faltan.
x-app: &app
    build:
        context: .
        dockerfile: Dockerfile
    image: {{ project.name }}-app
    restart: unless-stopped
    env_file:
        - .env
    environment:
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: "3306"
        DB_DATABASE: ${DB_DATABASE_NAME:-{{ project.name }}}
        DB_USERNAME: ${DB_USERNAME:?define DB_USERNAME en .env}
        DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
        REDIS_HOST: redis
        REDIS_PASSWORD: ${REDIS_PASSWORD:?define REDIS_PASSWORD en .env}
        TRUSTED_PROXIES: "*"
    depends_on:
        mysql:
            condition: service_healthy
        redis:
            condition: service_started

services:
    app:
        <<: *app
        container_name: {{ project.name }}-app

    worker:
        <<: *app
        container_name: {{ project.name }}-worker
        command: php artisan queue:work --tries=3 --timeout=120

    scheduler:
        <<: *app
        container_name: {{ project.name }}-scheduler
        command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"

    nginx:
        image: nginx:1.27-alpine
        container_name: {{ project.name }}-nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/public:ro
        depends_on:
            - app

    redis:
        image: redis:7-alpine
        container_name: {{ project.name }}-redis
        restart: unless-stopped
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?define REDIS_PASSWORD en .env}"]

    mysql:
        image: mysql:8.0
        container_name: {{ project.name }}-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE_NAME:-{{ project.name }}}
            MYSQL_USER: ${DB_USERNAME:?define DB_USERNAME en .env}
            MYSQL_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?define DB_ROOT_PASSWORD en .env}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
            interval: 10s
            timeout: 5s
            retries: 10

volumes:
    mysql-data:
